# =====================================================================
# Meeting schedule — edit this file to update the Schedule page.
#
# Slot types:
#   break     – registration, coffee, lunch (shown as a thin shaded bar)
#   plenary   – one event for everyone (opening, keynote, joint panel)
#   parallel  – up to 4 simultaneous sessions, one per track
#
# Times are plain text, shown exactly as written.
#
# Each talk has: time, speaker, affiliation (optional), title.
# =====================================================================

# Tracks: each track always meets in the same room.
tracks:
  - id: A
    room: "Room A (TBD)"
  - id: B
    room: "Room B (TBD)"
  - id: C
    room: "Room C (TBD)"
  - id: D
    room: "Room D (TBD)"

# Session themes: `id` is used in the sessions below and shown on the filter
# buttons and session labels; `name` appears when hovering over them and is searchable.
# `color` sets the theme's accent color.
themes:
  - id: T1
    name: "Theme 1"
    color: "#2563eb"
  - id: T2
    name: "Theme 2"
    color: "#16a34a"
  - id: T3
    name: "Theme 3"
    color: "#c2410c"

days:
  - date: 2027-05-21
    label: "Friday, May 21"
    slots:
      - start: "7:00"
        end: "8:00"
        type: break
        title: "Registration and Coffee"

      - start: "8:00"
        end: "8:50"
        type: plenary
        title: "Opening and Welcome"
        room: "Main Hall (TBD)"

      - start: "9:00"
        end: "10:20"
        type: parallel
        sessions:
          - id: 1A
            track: A
            theme: T1
            title: "Session 1A"
            # Placeholder talks: all names, institutions, and titles are fictional.
            talks:
